<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>evangelion</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { background: #000; height: 100%; font-family: 'Times New Roman', serif; overflow: hidden; }
        body { display: flex; align-items: center; justify-content: center; }
        .shell {
            display: flex;
            align-items: stretch;
            width: 100vw;
            height: 100vh;
        }
        .terminal {
            flex: 1;
            overflow: hidden;
            position: relative;
            min-width: 0;
        }
        .terminal canvas {
            width: 100%;
            height: 100%;
        }
        .center {
            position: relative;
            flex: 0 0 auto;
            width: min(64vw, 820px);
            display: flex;
            align-items: center;
        }
        .frame {
            border: 1px solid rgba(83, 234, 94, 0.1);
            box-shadow: 0 0 80px rgba(83, 234, 94, 0.02);
            position: relative;
            width: 100%;
        }
        .frame::before, .frame::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            border-color: rgba(83, 234, 94, 0.25);
            border-style: solid;
            z-index: 2;
        }
        .frame::before { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
        .frame::after { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }
        video { width: 100%; display: block; background: #000; }
    </style>
</head>
<body>
    <div class="shell">
        <div class="terminal" id="termL"><canvas id="canL"></canvas></div>
        <div class="center">
            <div class="frame">
                <video id="vid" controls preload="metadata">
                    <source src="https://github.com/evayzh/evayzh.github.io/releases/download/evangelion-v1/cruel-thesis-web.mp4" type="video/mp4">
                </video>
            </div>
        </div>
        <div class="terminal" id="termR"><canvas id="canR"></canvas></div>
    </div>

    <script>
    const canL = document.getElementById('canL');
    const canR = document.getElementById('canR');
    const ctxL = canL.getContext('2d');
    const ctxR = canR.getContext('2d');
    let frame = 0;

    const FONT_SIZE = 11;
    const LINE_H = FONT_SIZE * 1.6;
    const FONT = `900 ${FONT_SIZE}px "Times New Roman", serif`;
    const PAD_X = 8;
    const PAD_Y = 8;

    // colors
    const C = {
        normal: '#FFFFFF',
        dim:    'rgba(255,255,255,0.35)',
        bright: '#FFFFFF',
        warn:   'rgba(255,200,100,0.9)',
        red:    'rgba(255,100,80,0.9)',
        cyan:   'rgba(150,230,230,0.8)',
        purple: 'rgba(220,160,255,0.8)',
    };

    // Each line is { text, color }
    // 'segments' version: [{ text, color }, ...]
    function line(text, color) { return [{ text, color: color || 'normal' }]; }
    function seg(parts) { return parts; } // array of {text, color}

    const STATUS = [
        line('NERV://MAGI.SYS', 'bright'),
        line('────────────────────', 'dim'),
        seg([{text:'CASPER   ', color:'normal'}, {text:'[ONLINE]', color:'bright'}]),
        seg([{text:'MELCHIOR ', color:'normal'}, {text:'[ONLINE]', color:'bright'}]),
        seg([{text:'BALTHASAR', color:'normal'}, {text:'[ONLINE]', color:'bright'}]),
        line('────────────────────', 'dim'),
        line('MAGI CONSENSUS: UNANIMOUS', 'cyan'),
    ];

    const LOGS_L = [
        () => seg([{text:`[${ts()}] `, color:'dim'}, {text:`FRAME ${pad(frame,5)}/${pad(4590,5)}`, color:'normal'}]),
        () => seg([{text:`[${ts()}] `, color:'dim'}, {text:`RENDER: PASS ${rng(1,4)}/4`, color:'normal'}]),
        () => seg([{text:`[${ts()}] `, color:'dim'}, {text:`OPTICAL_FLOW: ${rng(40,92)} PTS TRACKED`, color:'normal'}]),
        () => seg([{text:`[${ts()}] `, color:'dim'}, {text:`SHI_TOMASI: ${rng(60,80)} CORNERS`, color:'normal'}]),
        () => seg([{text:`[${ts()}] `, color:'dim'}, {text:`CANNY_EDGE: THRESHOLD ${rng(50,120)}`, color:'normal'}]),
        () => seg([{text:`[${ts()}] `, color:'dim'}, {text:`SYNC_RATIO: ${(Math.random()*20+80).toFixed(1)}%`, color:'cyan'}]),
        () => seg([{text:`[${ts()}] `, color:'dim'}, {text:`AT_FIELD: ACTIVE`, color:'purple'}]),
        () => seg([{text:`[${ts()}] `, color:'dim'}, {text:`LCL_DENSITY: ${(Math.random()*0.3+0.7).toFixed(3)}`, color:'normal'}]),
        () => seg([{text:`[${ts()}] `, color:'dim'}, {text:`EGO_BARRIER: STABLE`, color:'normal'}]),
        () => seg([{text:`[${ts()}] `, color:'dim'}, {text:`PATTERN: `, color:'normal'}, {text:`BLUE`, color:'bright'}]),
        () => seg([{text:`[${ts()}] `, color:'dim'}, {text:`SIGNAL_NOISE: ${(Math.random()*5).toFixed(2)}DB`, color:'normal'}]),
        () => seg([{text:`[${ts()}] `, color:'dim'}, {text:`EVA_UNIT_01: `, color:'normal'}, {text:`READY`, color:'bright'}]),
        () => seg([{text:`[${ts()}] `, color:'dim'}, {text:`PILOT_STATUS: NOMINAL`, color:'normal'}]),
        () => seg([{text:`[${ts()}] `, color:'dim'}, {text:`UMBILICAL: CONNECTED`, color:'normal'}]),
        () => seg([{text:`[${ts()}] `, color:'dim'}, {text:`WARN: SYNC DRIFT +${(Math.random()*2).toFixed(1)}%`, color:'warn'}]),
        () => seg([{text:`[${ts()}] `, color:'dim'}, {text:`BUFFER: ${rng(85,99)}% UTILIZED`, color:'normal'}]),
        () => seg([{text:`[${ts()}] `, color:'dim'}, {text:`ENCODING: H264 CRF=${rng(16,22)}`, color:'normal'}]),
        () => seg([{text:`[${ts()}] `, color:'dim'}, {text:`BITRATE: ${rng(1800,3200)}KBPS`, color:'normal'}]),
        () => seg([{text:`[${ts()}] `, color:'dim'}, {text:`PROCESSING: OPENCV ${rng(35,48)}.${rng(0,9)} FPS`, color:'normal'}]),
        () => seg([{text:`[${ts()}] `, color:'dim'}, {text:`ALERT: BERSERKER THRESHOLD ${rng(1,8)}%`, color:'red'}]),
    ];

    const LOGS_R = [
        () => seg([{text:`${ts()} `, color:'dim'}, {text:`RENDERING [${'█'.repeat(Math.floor(frame/4590*16))}${'░'.repeat(16-Math.floor(frame/4590*16))}] ${(frame/4590*100).toFixed(1)}%`, color:'normal'}]),
        () => seg([{text:`${ts()} `, color:'dim'}, {text:`TRACKING_PT[${pad(rng(0,79),2)}] (${pad(rng(0,1920),4)},${pad(rng(0,1080),4)})`, color:'normal'}]),
        () => seg([{text:`${ts()} `, color:'dim'}, {text:`TRACKING_PT[${pad(rng(0,79),2)}] (${pad(rng(0,1920),4)},${pad(rng(0,1080),4)})`, color:'normal'}]),
        () => seg([{text:`${ts()} `, color:'dim'}, {text:`HUD_OVERLAY: NERV.ACTIVE`, color:'purple'}]),
        () => seg([{text:`${ts()} `, color:'dim'}, {text:`CROSSHAIR_DRAW: ${rng(8,24)} TARGETS`, color:'normal'}]),
        () => seg([{text:`${ts()} `, color:'dim'}, {text:`TRAIL_LENGTH: ${rng(20,40)} FRAMES`, color:'normal'}]),
        () => seg([{text:`${ts()} `, color:'dim'}, {text:`CONNECTION_LINES: ${rng(30,120)}`, color:'cyan'}]),
        () => seg([{text:`${ts()} `, color:'dim'}, {text:`EDGE_PIXELS: ${rng(8000,32000)}`, color:'normal'}]),
        () => seg([{text:`${ts()} `, color:'dim'}, {text:`GRID_OVERLAY: 1920X1080`, color:'normal'}]),
        () => seg([{text:`${ts()} `, color:'dim'}, {text:`COLOR_MAP: EVA_UNIT_01`, color:'normal'}]),
        () => seg([{text:`${ts()} `, color:'dim'}, {text:`COORD_LABELS: ${rng(20,60)} DRAWN`, color:'normal'}]),
        () => seg([{text:`${ts()} `, color:'dim'}, {text:`MEM: ${rng(280,420)}MB / 1024MB`, color:'normal'}]),
        () => seg([{text:`${ts()} `, color:'dim'}, {text:`GPU_TEMP: ${rng(58,72)}°C`, color:'normal'}]),
        () => seg([{text:`${ts()} `, color:'dim'}, {text:`QUEUE: ${rng(0,3)} PENDING`, color:'warn'}]),
        () => seg([{text:`${ts()} `, color:'dim'}, {text:`OUTPUT: 1920X1080@30FPS`, color:'normal'}]),
        () => seg([{text:`${ts()} `, color:'dim'}, {text:`ETA: ${Math.max(0, Math.floor((4590-frame)/38))}S`, color:'normal'}]),
        () => seg([{text:`${ts()} `, color:'dim'}, {text:`MAGI_VOTE: `, color:'normal'}, {text:`PROCEED`, color:'bright'}]),
        () => seg([{text:`${ts()} `, color:'dim'}, {text:`TARGET: `, color:'normal'}, {text:`ANGEL DETECTED`, color:'red'}]),
    ];

    function ts() {
        const s = Math.floor(frame / 30);
        const m = Math.floor(s / 60);
        return `${pad(m,2)}:${pad(s%60,2)}:${pad(frame%30,2)}`;
    }
    function pad(n, w) { return String(n).padStart(w, '0'); }
    function rng(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }

    const MAX_LINES = 200;
    let linesL = [], linesR = [];

    // init left
    STATUS.forEach(s => linesL.push(s));
    linesL.push(line(''));
    linesL.push(line('>>> INITIALIZING TRACKER', 'bright'));
    linesL.push(line('────────────────────', 'dim'));
    linesL.push(line(''));

    // init right
    linesR.push(line('OXIS//EVANGELION TRACKER V1.0', 'bright'));
    linesR.push(line('═══════════════════════════', 'dim'));
    linesR.push(line('INPUT: CRUEL-THESIS-RENDERED.MP4'));
    linesR.push(line('RES: 1920X1080 @ 30FPS'));
    linesR.push(line('FRAMES: 4590 (153.0S)'));
    linesR.push(line('═══════════════════════════', 'dim'));
    linesR.push(line(''));

    function sizeCanvas(can) {
        const dpr = window.devicePixelRatio || 1;
        const rect = can.parentElement.getBoundingClientRect();
        can.width = rect.width * dpr;
        can.height = rect.height * dpr;
        const ctx = can.getContext('2d');
        ctx.scale(dpr, dpr);
        return { w: rect.width, h: rect.height };
    }

    function drawTerminal(ctx, lines, w, h) {
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, w, h);
        ctx.font = FONT;
        ctx.textBaseline = 'top';

        // how many lines fit (with vertical stretch 1.5x)
        const stretchedLineH = LINE_H * 1.5;
        const maxVisible = Math.floor((h - PAD_Y) / stretchedLineH);
        const startIdx = Math.max(0, lines.length - maxVisible);

        ctx.save();
        ctx.setTransform(ctx.getTransform().a, 0, 0, ctx.getTransform().d * 1.5, 0, 0);

        for (let i = startIdx; i < lines.length; i++) {
            const row = i - startIdx;
            const y = PAD_Y / 1.5 + row * LINE_H;
            const segments = lines[i];
            let x = PAD_X;

            for (const s of segments) {
                const color = C[s.color] || C.normal;
                ctx.fillStyle = color;
                ctx.strokeStyle = color;

                // canvas shadow glow like eva-title.js
                if (s.color === 'bright') {
                    ctx.shadowColor = 'orange';
                    ctx.shadowBlur = 8;
                } else if (s.color === 'dim') {
                    ctx.shadowColor = 'transparent';
                    ctx.shadowBlur = 0;
                } else {
                    ctx.shadowColor = 'orange';
                    ctx.shadowBlur = 6;
                }

                ctx.fillText(s.text, x, y);
                x += ctx.measureText(s.text).width;
            }
        }
        ctx.restore();

        // scanline overlay
        ctx.save();
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        for (let sy = 0; sy < h; sy += 4) {
            ctx.fillRect(0, sy + 2, w, 2);
        }
        ctx.restore();
    }

    function addLine(arr, segments) {
        arr.push(segments);
        if (arr.length > MAX_LINES) arr.shift();
    }

    let sizeL, sizeR;
    function resize() {
        sizeL = sizeCanvas(canL);
        sizeR = sizeCanvas(canR);
    }
    window.addEventListener('resize', resize);
    resize();

    function tick() {
        frame = (frame + 1) % 4591;

        if (Math.random() < 0.05) {
            addLine(linesL, LOGS_L[Math.floor(Math.random() * LOGS_L.length)]());
        }
        if (Math.random() < 0.065) {
            addLine(linesR, LOGS_R[Math.floor(Math.random() * LOGS_R.length)]());
        }

        drawTerminal(ctxL, linesL, sizeL.w, sizeL.h);
        drawTerminal(ctxR, linesR, sizeR.w, sizeR.h);
    }

    setInterval(tick, 1000 / 60);
    </script>
</body>
</html>
